name: Update Absorb source

on:
  push:
    branches: [main]
    paths-ignore:
      - apps.json
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-absorb-source
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py

      - name: Validate JSON
        run: python -m json.tool apps.json >/dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json

          if git diff --cached --quiet; then
            echo "Source is already up to date."
            exit 0
          fi

          git commit -m "Update Absorb source"
          git push
